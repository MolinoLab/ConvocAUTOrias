services:
  ollama:
    image: ollama/ollama:latest
    container_name: convocauto-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  bot:
    build: .
    image: convocauto-bot:latest
    container_name: convocauto-bot
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - .:/app
      - ./convocatorias.csv:/app/convocatorias.csv
    depends_on:
      - ollama
    restart: unless-stopped

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: convocauto-n8n:latest
    container_name: convocauto-n8n
    ports:
      - "5678:5678"
    env_file: .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - NODES_EXCLUDE=[]
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/app
      - ./convocatorias.csv:/app/convocatorias.csv
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  n8n_data:
