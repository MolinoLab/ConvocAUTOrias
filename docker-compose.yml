services:
  ollama:
    image: ollama/ollama:latest
    container_name: convocauto-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        limits:
          memory: 15G
        reservations:
          memory: 512M
    restart: unless-stopped

  bot:
    build: .
    image: convocauto-bot:latest
    container_name: convocauto-bot
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - .:/app
    depends_on:
      - ollama
    restart: unless-stopped

  api:
    build: .
    image: convocauto-bot:latest
    container_name: convocauto-api
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - .:/app
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8888"]
    ports:
      - "8888:8888"
    depends_on:
      - ollama
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: convocauto-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=4vt0m4t1z4nd0?
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    restart: unless-stopped

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: convocauto-openclaw
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured"]
    ports:
      - "18789:18789"
    environment:
      - OLLAMA_API_KEY=ollama-local
    volumes:
      - ./openclaw:/home/node/.openclaw
    depends_on:
      - ollama
      - api
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

volumes:
  ollama_data:
  n8n_data:
