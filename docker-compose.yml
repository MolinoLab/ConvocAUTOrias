services:
  ollama:
    image: ollama/ollama:latest
    container_name: convocauto-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  bot:
    build: .
    image: convocauto-bot:latest
    container_name: convocauto-bot
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - .:/app
      - convocauto_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  api:
    build: .
    image: convocauto-bot:latest
    container_name: convocauto-api
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - .:/app
      - convocauto_data:/app/data
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8888"]
    ports:
      - "8888:8888"
    depends_on:
      - ollama
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: convocauto-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    restart: unless-stopped

volumes:
  convocauto_data:
  ollama_data:
  n8n_data:
